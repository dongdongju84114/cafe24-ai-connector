services:
  - type: web
    name: cafe24-ai-connector
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: HOST
        value: 0.0.0.0
      - key: CAFE24_TOKEN_SOURCE
        value: luna
      - key: CAFE24_DEFAULT_MALL_ID
        value: opengallery12
      - key: CAFE24_API_VERSION
        value: 2026-03-01
      - key: CAFE24_ALLOWED_ADMIN_PATH_PREFIXES
        value: /api/v2/admin/orders,/api/v2/admin/products,/api/v2/admin/categories,/api/v2/admin/coupons,/api/v2/admin/customersprivacy,/api/v2/admin/financials,/api/v2/admin/reports
      - key: LUNA_CAFE24_TOKEN_URL
        value: https://www.opengallery.co.kr/api/cafe24/connector-token/
      - key: LUNA_CAFE24_MANAGE_URL
        value: https://www.opengallery.co.kr/luna/cafe24/
      - key: LUNA_CAFE24_TOKEN_CACHE_TTL_MS
        value: 600000
      - key: LUNA_CAFE24_TOKEN_TIMEOUT_MS
        value: 15000
      - key: LUNA_CAFE24_TOKEN_API_KEY
        sync: false
      - key: INTERNAL_API_KEY
        generateValue: true
